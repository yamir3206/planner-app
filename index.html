<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="آکسون - برنامه‌ریز کنکور زیبا، هر دیتابیس" />
    <meta name="theme-color" content="#6366F1" />
    <title>آکسون - برنامه‌ریز کنکور</title>
    <script>try{var c=localStorage.getItem('axon_theme_color')||'axon';var m=localStorage.getItem('axon_theme_mode')||'system';var r=document.documentElement;r.classList.add('theme-'+c);r.classList.add(m==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):m)}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
