<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/planner-app/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="آکسون - برنامه‌ریز کنکور زیبا، هر دیتابیس" />
    <meta name="theme-color" content="#6366F1" />
    <title>آکسون - برنامه‌ریز کنکور</title>
    <style>
      #root:empty { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f8f7ff; }
      #root:empty::after { content: "در حال بارگذاری آکسون..."; font-family: Vazirmatn, sans-serif; color: #6366F1; font-weight: bold; animation: pulse 1.5s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .error-fallback { padding: 20px; margin: 20px; background: white; border: 2px solid red; border-radius: 10px; color: #333; font-family: sans-serif; }
    </style>
    <script>
      window.__axon_errors = [];
      window.addEventListener('error', function(e) {
        console.error('Global error:', e.error || e.message);
        window.__axon_errors.push({message: e.message, file: e.filename, line: e.lineno, col: e.colno, error: e.error});
        var root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          root.innerHTML = '<div class="error-fallback"><h2>خطا در بارگذاری</h2><p>' + e.message + '</p><p>' + (e.filename||'') + ':' + (e.lineno||'') + '</p><button onclick="location.reload()">تلاش مجدد</button><button onclick="localStorage.clear();location.reload()">پاک کردن حافظه</button></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled rejection:', e.reason);
        window.__axon_errors.push({message: 'Promise: ' + (e.reason?.message || e.reason)});
      });
      try {
        var c = localStorage.getItem('axon_theme_color') || 'axon';
        var m = localStorage.getItem('axon_theme_mode') || 'system';
        var r = document.documentElement;
        if (r) {
          r.classList.add('theme-'+c);
          r.classList.add(m==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):m);
        }
      } catch(e) { console.warn('Theme error', e); }
    </script>
    <script type="module" crossorigin src="/planner-app/assets/index-CG-GosnJ.js"></script>
    <link rel="stylesheet" crossorigin href="/planner-app/assets/index-BCOUZv52.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript><div style="padding:20px;text-align:center;font-family:sans-serif">برای استفاده از آکسون، جاوااسکریپت را فعال کنید</div></noscript>
  </body>
</html>
